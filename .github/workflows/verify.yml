name: Verify RepoLens
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: repolens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repolens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r requirements.txt
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: node --test tests-js/*.test.mjs
      - name: Section 1 — migration TDD, legacy storage E2E and real PostgreSQL integration
        run: python -m pytest -q tests/test_section1_migrations.py tests/test_section1_cli.py tests/test_section1_database_e2e.py tests/test_postgres_integration.py
        env:
          REPOLENS_TEST_POSTGRES_URL: postgresql+psycopg://repolens:integration-test-only@127.0.0.1:5432/repolens_test
      - name: Section 2 — account security TDD, API E2E, and real PostgreSQL integration
        run: python -m pytest -q tests/test_section2_auth_tdd.py tests/test_section2_api_e2e.py tests/test_postgres_integration.py
        env:
          REPOLENS_TEST_POSTGRES_URL: postgresql+psycopg://repolens:integration-test-only@127.0.0.1:5432/repolens_test
      - name: Section 4 — TDD, HTTP integration, atomic quotas and real PostgreSQL
        run: python -m pytest -q tests/test_section4_limits_red.py tests/test_section4_tdd.py tests/test_section4_http_integration.py tests/test_section4_postgres_integration.py
        env:
          REPOLENS_TEST_POSTGRES_URL: postgresql+psycopg://repolens:integration-test-only@127.0.0.1:5432/repolens_test
      - run: python -m pytest -q
        env:
          REPOLENS_TEST_POSTGRES_URL: postgresql+psycopg://repolens:integration-test-only@127.0.0.1:5432/repolens_test
      - run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: frontend
      - name: Real HTTP smoke (synthetic accounts; not OAuth acceptance)
        run: python scripts/verify_release_http.py
      - name: Phase 11 release-gate report (external checks remain blocked)
        run: python scripts/phase11_gate.py --output reports/phase11-ci-gate.json
      - name: Package clean source archive and verify integrity
        run: |
          python scripts/package_release.py /tmp/repolens-phase11-ci.zip
          python -c "import zipfile; assert zipfile.ZipFile('/tmp/repolens-phase11-ci.zip').testzip() is None"
